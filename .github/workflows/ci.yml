name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb-ha:pg16
        env:
          POSTGRES_USER: lens
          POSTGRES_PASSWORD: lens
          POSTGRES_DB: lens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lens -d lens"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/Lens.Web/package-lock.json
      - name: Angular build
        working-directory: src/Lens.Web
        run: npm ci && npx ng build --configuration production
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build -c Release --no-restore
      - name: Unit tests
        run: dotnet test tests/Lens.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx"
      - name: Schema applies to a real Postgres
        env:
          PGPASSWORD: lens
        run: psql -h localhost -U lens -d lens -v ON_ERROR_STOP=1 -f db/init.sql
      - name: Docker image builds
        run: docker build -f src/Lens.Api/Dockerfile -t lens-api:ci .
